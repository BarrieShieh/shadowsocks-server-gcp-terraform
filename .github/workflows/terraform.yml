name: Deploy Shadowsocks

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Action"
        required: true
        default: "plan"
        type: choice
        options: [ plan, apply, destroy ]
      environment:
        description: "Target Environment (maps to GitHub Environment for secrets/vars)"
        required: true
        type: choice
        options:
          - "cloud-162606"
      config:
        description: "The name of config"
        required: true
        type: string

env:
  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_email_address: ${{ vars.EMAIL_ADDRESS }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_subdomain: ${{ vars.SUBDOMAIN }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}      # 3. 必须加上这行，下拉框选中的环境才能真正加载对应的 Secrets/Vars
    steps:
      # Step 1: Checkout primary Terraform codebase
      - name: Checkout Terraform Code
        uses: actions/checkout@v4

      # Step 2: Checkout private repository containing .tfvars files under the same GitHub account
      - name: Checkout Configs/tfvars Repository
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/shadowsocks-server-gcp-configurations"
          token: ${{ secrets.PAT }}
          path: "tfvars-config"

      # Step 3: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 4: Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init

      # Step 5: Execute Terraform Action with external .tfvars file
      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.config }}.tfvars"

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.config }}.tfvars"

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.config }}.tfvars"