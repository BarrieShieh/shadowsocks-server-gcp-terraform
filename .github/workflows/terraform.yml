name: Deploy Shadowsocks
run-name: ${{ inputs.action }} [${{ inputs.environment }}] - [${{ inputs.instance }}]

on:
  workflow_dispatch:
    inputs:
      tf_org:
        description: "Choose Terraform Cloud Organization"
        required: true
        type: choice
        options:
          - "hcp_coding"
      action:
        description: "Choose Action"
        required: true
        default: "plan"
        type: choice
        options:
          - "plan"
          - "apply"
          - "destroy"
      environment:
        description: "Target Environment (Google Cloud Project ID)"
        required: true
        type: choice
        options:
          - "cloud-162606"
      instance:
        description: "Host name and GCP resource ID for the Compute Engine VM instance"
        required: true
        type: string

env:
  # Pass GCP Project ID to Terraform input variable 'var.gcp_project_id'
  TF_VAR_gcp_project_id: ${{ inputs.environment }}

  # Pass GCP Service Account key to Terraform input variable 'var.gcp_sa_key'
  TF_VAR_gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # Pass Cloudflare API Token to Terraform input variable 'var.cloudflare_api_token'
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Authenticate Terraform CLI with Terraform Cloud (app.terraform.io)
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

  # Set target Terraform Cloud Organization
  TF_CLOUD_ORGANIZATION: ${{ inputs.tf_org }}

  # Set target Terraform Cloud Workspace
  TF_WORKSPACE: ${{ inputs.environment }}

  # Pass target Compute Engine VM instance name to Terraform variable 'var.instance_name'
  TF_VAR_instance_name: ${{ inputs.instance }}

jobs:
  deploy:
    name: ${{ inputs.action }} [${{ inputs.environment }}] - [${{ inputs.instance }}]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Step 1: Checkout the primary Terraform codebase
      - name: Checkout Terraform Code
        uses: actions/checkout@v4

      # Step 2: Checkout private configuration repository containing instance-specific .tfvars files
      - name: Checkout Configs/tfvars Repository
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/shadowsocks-server-gcp-configurations"
          token: ${{ secrets.PAT }}
          path: "tfvars-config"

      # Step 3: Install and configure Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 4: Initialize backend and providers
      - name: Terraform Init
        run: terraform init

      # Step 5: Generate plan file for plan and apply workflows
      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' || inputs.action == 'apply' }}
        run: |
          terraform plan -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.instance }}.tfvars" -out=tfplan
          terraform show -json tfplan > tfplan.json

      # Step 6: Generate destroy plan file for teardown workflows
      - name: Terraform Plan (Destroy)
        if: ${{ inputs.action == 'destroy' }}
        run: |
          terraform plan -destroy -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.instance }}.tfvars" -out=tfplan
          terraform show -json tfplan > tfplan.json

      # Step 7: Install tf-summarize tool to parse JSON plan output
      - name: Setup tf-summarize
        uses: kishaningithub/setup-tf-summarize@v1

      # Step 8: Render Markdown summary of proposed infrastructure changes to GitHub Job Summary
      - name: Summarize Plan
        run: |
          echo "## 📊 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          tf-summarize -md tfplan.json >> $GITHUB_STEP_SUMMARY

      # Step 9: Execute Terraform apply using the saved execution plan
      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply tfplan

      # Step 10: Execute Terraform destroy using the saved execution plan
      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform apply tfplan

      # Step 11: Export Terraform outputs to file artifacts and append text summary to Job Summary
      - name: Export Terraform Output
        if: ${{ inputs.action == 'apply' }}
        run: |
          terraform output -json > terraform_output.json
          terraform output > terraform_output.txt
          
          # Render outputs directly in the GitHub Job Summary view
          echo "## 📊 Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat terraform_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
