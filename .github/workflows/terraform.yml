name: Deploy Shadowsocks
run-name: ${{ inputs.action }} [${{ inputs.environment }}] - [${{ inputs.config }}]

on:
  workflow_dispatch:
    inputs:
      tf_org:
        description: "Choose Terraform Cloud Organization"
        required: true
        type: choice
        options:
          - "hcp_coding"
      action:
        description: "Choose Action"
        required: true
        default: "plan"
        type: choice
        options:
          - "plan"
          - "apply"
          - "destroy"
      environment:
        description: "Target Environment (maps to GitHub Environment for secrets/vars)"
        required: true
        type: choice
        options:
          - "cloud-162606"
      config:
        description: "The name of config"
        required: true
        type: string

env:
  # GCP Project ID mapped to Terraform input variable 'var.gcp_project_id'
  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}

  # GCP Service Account key mapped to Terraform input variable 'var.gcp_sa_key'
  TF_VAR_gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # Cloudflare API Token mapped to Terraform input variable 'var.cloudflare_api_token'
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # API Token used by Terraform CLI to authenticate with Terraform Cloud (app.terraform.io)
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

  # Terraform Cloud Organization name
  TF_CLOUD_ORGANIZATION: ${{ inputs.tf_org }}

  # Terraform Cloud Workspace name
  TF_WORKSPACE: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    name: ${{ inputs.action }} [${{ inputs.environment }}] - [${{ inputs.config }}]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Step 1: Checkout primary Terraform codebase
      - name: Checkout Terraform Code
        uses: actions/checkout@v4

      # Step 2: Checkout private repository containing .tfvars files under the same GitHub account
      - name: Checkout Configs/tfvars Repository
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/shadowsocks-server-gcp-configurations"
          token: ${{ secrets.PAT }}
          path: "tfvars-config"

      # Step 3: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 4: Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init

      # Step 5: Execute Terraform Action with external .tfvars file
      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.config }}.tfvars" -lock=false

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.config }}.tfvars"

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve -var-file="tfvars-config/deployments/${{ inputs.environment }}/${{ inputs.config }}.tfvars"

          # Step 6: Export Terraform outputs after successful apply (including sensitive values)
      - name: Export Terraform Output
        if: ${{ inputs.action == 'apply' }}
        run: |
          terraform output -json > terraform_output.json
          terraform output > terraform_output.txt
          
          # Render outputs directly in the GitHub Job Summary view
          echo "## Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat terraform_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Step 7: Upload output artifacts for workflow download
      - name: Upload Output Artifact
        if: ${{ inputs.action == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs-${{ inputs.environment }}-${{ inputs.config }}-${{ github.run_id }}
          path: |
            terraform_output.json
            terraform_output.txt
          retention-days: 1